server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Nom du conteneur, pas "api" : tout service "api" branché sur le réseau traefik répondrait à ce nom
    location /api/ {
        proxy_pass http://customapps-api:3500;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}
